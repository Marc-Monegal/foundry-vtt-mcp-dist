name: Publish release

# Committing a new folder releases/<version>/ (with module.json, foundry-vtt-mcp.zip,
# foundry-mcp-server-<version>.zip and NOTES.md) to main publishes it as release v<version>.
# Foundry reads module.json from the latest release.
on:
  push:
    branches: [main]
    paths: ['releases/*/module.json', '.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish releases that do not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for DIR in releases/*/; do
            VERSION=$(basename "$DIR")
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already published"
              continue
            fi
            test -f "$DIR/module.json" && test -f "$DIR/foundry-vtt-mcp.zip"
            gh release create "$TAG" \
              "$DIR/foundry-vtt-mcp.zip" "$DIR/module.json" "$DIR"/foundry-mcp-server-*.zip \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file "$DIR/NOTES.md" --latest
          done
